<!DOCTYPE html>
<html lang="en">

<head th:replace="~{Dashboard/fragments/header :: header('Add New User')}"></head>

<body id="page-top">

<div id="wrapper">

    <div th:replace="~{Dashboard/fragments/sidebar :: sidebar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">

        <div id="content">

            <div th:replace="~{Dashboard/fragments/topbar :: topbar}"></div>

            <div class="container-fluid">

                <div th:replace="~{Dashboard/fragments/breadcrumb :: breadcrumb}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h3 mb-1 font-weight-bold text-dark">
                            Add New User
                        </h1>
                        <p class="text-muted mb-0">
                            Create and manage application users.
                        </p>
                    </div>

                    <a th:href="@{/admin/users}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left mr-2"></i>
                        Back to Users
                    </a>
                </div>

                <form th:action="@{/admin/users/save}"
                      th:object="${user}"
                      method="post"
                      enctype="multipart/form-data">

                    <div class="card shadow-sm mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">
                                Account Information
                            </h6>
                        </div>

                        <div class="card-body">

                            <div class="form-row">

                                <div class="form-group col-md-6">
                                    <label>Username</label>
                                    <input type="text"
                                           th:field="*{username}"
                                           class="form-control"
                                           required>
                                </div>

                                <div class="form-group col-md-6">
                                    <label>Email</label>
                                    <input type="email"
                                           th:field="*{email}"
                                           class="form-control"
                                           required>
                                </div>

                                <div class="form-group col-md-6">
                                    <label>First Name</label>
                                    <input type="text"
                                           th:field="*{firstName}"
                                           class="form-control">
                                </div>

                                <div class="form-group col-md-6">
                                    <label>Last Name</label>
                                    <input type="text"
                                           th:field="*{lastName}"
                                           class="form-control">
                                </div>

                                <div class="form-group col-md-6">
                                    <label>Password</label>
                                    <input type="password"
                                           th:field="*{password}"
                                           class="form-control"
                                           required>
                                </div>

                                <div class="form-group col-md-6">
                                    <label>User Role</label>
                                    <select th:field="*{userRole}"
                                            class="form-control"
                                            required>

                                        <option value="">Select Role</option>

                                        <option th:each="role : ${roles}"
                                                th:value="${role.role}"
                                                th:text="${role.role}">
                                        </option>

                                    </select>
                                </div>

                            </div>

                        </div>
                    </div>

                    <div class="card shadow-sm mb-4">

                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">
                                Additional Information
                            </h6>
                        </div>

                        <div class="card-body">

                            <div class="form-row">

                                <div class="form-group col-md-6">
                                    <label>Phone Number</label>
                                    <input type="text"
                                           th:field="*{phoneNumber}"
                                           class="form-control">
                                </div>

                                <div class="form-group col-md-6">
                                    <label>City</label>
                                    <input type="text"
                                           th:field="*{userCity}"
                                           class="form-control">
                                </div>

                                <div class="form-group col-md-6">
                                    <label>Country</label>
                                    <input type="text"
                                           th:field="*{userCountry}"
                                           class="form-control">
                                </div>

                                <div class="form-group col-md-12">
                                    <label>Bio</label>
                                    <textarea th:field="*{userBio}"
                                              class="form-control"
                                              rows="4">
                                    </textarea>
                                </div>

                            </div>

                        </div>
                    </div>

                    <div class="text-right mb-4">
                        <a th:href="@{/admin/users}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save mr-2"></i>
                            Save User
                        </button>
                    </div>

                </form>

            </div>

            <div th:replace="~{Dashboard/fragments/copyright :: copyright}"></div>

        </div>

    </div>

    <div th:replace="~{Dashboard/fragments/scrolltotop :: scrolltotop}"></div>
    <div th:replace="~{Dashboard/fragments/logout-modal :: logout-modal}"></div>
    <div th:replace="~{Dashboard/fragments/footer :: footer}"></div>

</div>

</body>
</html>
