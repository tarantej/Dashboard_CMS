<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{Dashboard/fragments/header :: header('Technology')}">

</head>

<body id="page-top">
<div id="wrapper">

    <div th:replace="~{Dashboard/fragments/sidebar :: sidebar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <div th:replace="~{Dashboard/fragments/topbar :: topbar}"></div>

            <div class="container-fluid">

                <div th:replace="~{Dashboard/fragments/breadcrumb :: breadcrumb}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>
                        <h1 class="h3 mb-1 font-weight-bold text-dark">Technology</h1>
                        <p class="text-muted mb-0">
                            Manage the technologies used across your projects.
                        </p>
                    </div>

                    <a th:href="@{/dashboard/technologies/add}"
                       class="btn btn-primary">
                        <i class="fas fa-plus mr-2"></i>
                        Add New Technology
                    </a>

                </div>

                <div class="card shadow-sm mb-4">

                    <div class="card-header py-3 d-flex flex-column flex-md-row
                                align-items-md-center justify-content-between">

                        <h6 class="m-0 fw-bold text-primary mb-3 mb-md-0">
                            All Technologies
                        </h6>

                    </div>

                    <div class="card-body">

                        <!-- Results Information -->
                        <div class="mb-3 text-muted small"
                             th:if="${!#lists.isEmpty(technologies)}">

                            Showing all
                            <span th:text="${#lists.size(technologies)}"></span>
                            technologies

                        </div>

                        <!-- Table -->
                        <div class="table-responsive">

                            <table id="technologyTable" class="table table-bordered table-hover align-middle"
                                   width="100%"
                                   cellspacing="0">

                                <thead class="table-light">
                                <tr>
                                    <th style="width: 70px;">ID</th>
                                    <th>Technology</th>
                                    <th>Slug</th>
                                    <th>Version</th>
                                    <th>Category</th>
                                    <th class="text-center" style="width: 120px;">Actions</th>
                                </tr>
                                </thead>

                                <tbody>

                                <tr th:each="technology : ${technologies}">

                                    <td th:text="${technology.technologyId}"></td>

                                    <td>
                                        <div class="d-flex align-items-center">

                                            <img th:if="${technology.technologyLogo != null
                                                         and !technology.technologyLogo.isBlank()}"
                                                 th:src="${technology.technologyLogo}"
                                                 th:alt="${technology.technologyName}"
                                                 style="width: 28px; height: 28px;
                                                        object-fit: contain;"
                                                 class="me-2">

                                            <span th:text="${technology.technologyName}"
                                                  class="fw-bold"></span>

                                        </div>
                                    </td>

                                    <td>
                                        <span th:text="${technology.technologySlug != null
                                                        and !technology.technologySlug.isBlank()
                                                        ? technology.technologySlug
                                                        : '—'}"></span>
                                    </td>

                                    <td>
                                        <span th:text="${technology.technologyVersion != null
                                                        and !technology.technologyVersion.isBlank()
                                                        ? technology.technologyVersion
                                                        : '—'}"></span>
                                    </td>

                                    <td>
                                        <span th:text="${technology.technologyCategory != null
                                                        and !technology.technologyCategory.isBlank()
                                                        ? technology.technologyCategory
                                                        : '—'}"></span>
                                    </td>

                                    <td class="text-center">

                                        <a th:href="@{/dashboard/technologies/edit/{id}
             (id=${technology.technologyId})}"
                                           class="btn btn-sm btn-primary"
                                           title="Edit Technology">

                                            <i class="bi bi-pencil-square"></i>

                                        </a>

                                    </td>

                                </tr>

                                <!-- Empty Results -->
                                <tr th:if="${#lists.isEmpty(technologies)}">
                                    <td colspan="6" class="text-center py-4 text-muted">
                                        <i class="fas fa-microchip fa-2x mb-2"></i>
                                        <p class="mb-0">No technologies found.</p>
                                    </td>
                                </tr>

                                </tbody>

                            </table>

                        </div>


                    </div>
                </div>

            </div>
        </div>

        <div th:replace="~{Dashboard/fragments/copyright :: copyright}"></div>
    </div>
</div>

<div th:replace="~{Dashboard/fragments/scrolltotop :: scrolltotop}"></div>
<div th:replace="~{Dashboard/fragments/logout-modal :: logout-modal}"></div>
<div th:replace="~{Dashboard/fragments/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        const table = new DataTable('#technologyTable', {

            pageLength: 10,

            lengthMenu: [10, 25, 50, 100],

            ordering: true,
            searching: true,
            paging: true,
            info: true,

            order: [ [1, 'asc'] ],

            responsive: true,

            columnDefs: [
                {
                    orderable: false,
                    targets: 5
                }
            ]

        });

    });
</script>

</body>
</html>
