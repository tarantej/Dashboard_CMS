<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{Dashboard/fragments/header :: header('Projects')}"></head>

<body id="page-top">
<div id="wrapper">

    <div th:replace="~{Dashboard/fragments/sidebar :: sidebar}"></div>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">

            <div th:replace="~{Dashboard/fragments/topbar :: topbar}"></div>

            <div class="container-fluid">

                <div th:replace="~{Dashboard/fragments/breadcrumb :: breadcrumb}"></div>

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>
                        <h1 class="h3 mb-1 font-weight-bold text-dark">Projects</h1>
                        <p class="text-muted mb-0">
                            Create and manage your portfolio projects.
                        </p>
                    </div>

                    <a th:href="@{/dashboard/projects/add}"
                       class="btn btn-primary">
                        <i class="fas fa-plus mr-2"></i>
                        Add New Project
                    </a>

                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-body">

                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead class="thead-light">
                                <tr>
                                    <th>Project</th>
                                    <th>Slug</th>
                                    <th>Type</th>
                                    <th>Status</th>
                                    <th>Featured</th>
                                    <th>Order</th>
                                    <th>Last Modified</th>
                                    <th class="text-center">Actions</th>
                                </tr>
                                </thead>

                                <tbody>

                                <tr th:each="project : ${projects}">

                                    <td>
                                        <strong th:text="${project.projectTitle}">
                                            Project Title
                                        </strong>
                                    </td>

                                    <td>
                                        <span th:text="${project.projectSlug}">
                                            project-slug
                                        </span>
                                    </td>

                                    <td>
                                        <span class="badge badge-info"
                                              th:text="${project.projectType.typeName}">
                                            Project Type
                                        </span>
                                    </td>

                                    <td>
                                        <span class="badge"
                                              th:classappend="${' badge-' + project.projectStatus.statusColor}"
                                              th:text="${project.projectStatus.statusName}">
                                            Status
                                        </span>
                                    </td>

                                    <td>
                                        <span th:if="${project.featuredProject}"
                                              class="badge badge-warning">
                                            Featured
                                        </span>

                                        <span th:unless="${project.featuredProject}"
                                              class="text-muted">
                                            —
                                        </span>
                                    </td>

                                    <td th:text="${project.displayOrder}">0</td>

                                    <td>
                                        <span th:text="${project.updatedAt != null
                                            ? #dates.format(project.updatedAt, 'dd MMM yyyy')
                                            : '-'}">
                                        </span>
                                    </td>

                                    <td class="text-center">

                                        <a th:href="@{/dashboard/projects/edit/{id}(id=${project.projectId})}"
                                           class="btn btn-sm btn-outline-primary"
                                           title="Edit Project">
                                            <i class="bi bi-pencil"></i>
                                        </a>

                                        <form th:action="@{/dashboard/projects/delete/{id}(id=${project.projectId})}"
                                              method="post"
                                              class="d-inline">

                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-danger"
                                                    title="Delete Project"
                                                    onclick="return confirm('Are you sure you want to delete this project?');">
                                                <i class="bi bi-trash"></i>
                                            </button>

                                        </form>

                                    </td>

                                </tr>

                                <tr th:if="${#lists.isEmpty(projects)}">
                                    <td colspan="8" class="text-center text-muted py-4">
                                        No projects found.
                                    </td>
                                </tr>

                                </tbody>
                            </table>

                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div th:replace="~{Dashboard/fragments/copyright :: copyright}"></div>
    </div>
</div>

<div th:replace="~{Dashboard/fragments/scrolltotop :: scrolltotop}"></div>
<div th:replace="~{Dashboard/fragments/logout-modal :: logout-modal}"></div>
<div th:replace="~{Dashboard/fragments/footer :: footer}"></div>

</body>
</html>
