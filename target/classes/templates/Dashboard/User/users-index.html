<!DOCTYPE html>
<html lang="en">

<head th:replace="~{Dashboard/fragments/header :: header('Users')}"></head>

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{Dashboard/fragments/sidebar :: sidebar}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">

            <!-- Topbar -->
            <div th:replace="~{Dashboard/fragments/topbar :: topbar}"></div>

            <!-- Begin Page Content -->
            <div class="container-fluid">

                <!-- Breadcrumb -->
                <div th:replace="~{Dashboard/fragments/breadcrumb :: breadcrumb}"></div>

                <!-- Page Heading -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>
                        <h1 class="h3 mb-1 font-weight-bold text-dark">
                            Users
                        </h1>

                        <p class="text-muted mb-0">
                            Create and manage application users.
                        </p>
                    </div>

                    <a th:href="@{/admin/users/add}"
                       class="btn btn-primary">
                        <i class="fas fa-plus mr-2"></i>
                        Add New User
                    </a>

                </div>

                <!-- Pages Content -->
                <div class="card shadow-sm mb-4">

                    <div class="card-body">

                        <!-- Search Users  -->

                        <form th:action="@{/admin/users}" method="get"
                              class="form-inline mb-4">

                            <input type="text"
                                   name="search"
                                   class="form-control mr-2"
                                   placeholder="Search username or email..."
                                   th:value="${search}">

                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-search mr-1"></i>
                                Search
                            </button>

                            <a th:href="@{/admin/users}"
                               class="btn btn-secondary ml-2">
                                Reset
                            </a>

                        </form>

                        <!-- Pages Table -->
                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead class="thead-light">
                                <tr>
                                    <th>User</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Provider</th>
                                    <th>Registered</th>
                                    <th class="text-center">Actions</th>
                                </tr>
                                </thead>

                                <tbody>

                                <tr th:each="user : ${users.content}">

                                    <!-- Username -->
                                    <td>
                                        <strong th:text="${user.username}">
                                            Username
                                        </strong>
                                    </td>

                                    <!-- Full Name -->
                                    <td>
            <span th:text="${(user.firstName != null ? user.firstName : '')
    + ' ' +
    (user.lastName != null ? user.lastName : '')}">
                Full Name
            </span>
                                    </td>

                                    <!-- Email -->
                                    <td>
            <span th:text="${user.email}">
                email@example.com
            </span>
                                    </td>

                                    <!-- Role -->
                                    <td>
            <span class="badge badge-info"
                  th:text="${user.userRole}">
                USER
            </span>
                                    </td>

                                    <!-- OAuth Provider -->
                                    <td>
            <span th:text="${user.oauthProvider != null
                ? user.oauthProvider : 'Local'}">
                Local
            </span>
                                    </td>

                                    <!-- Registration Date -->
                                    <td>
            <span th:text="${user.createdAt != null
                ? #dates.format(user.createdAt, 'dd MMM yyyy')
                : '-'}">
            </span>
                                    </td>

                                    <!-- Actions -->
                                    <td class="text-center">
                                        <!-- We'll add View, Edit and Delete here later -->
                                        <span class="text-muted">Coming soon</span>
                                    </td>

                                </tr>

                                <!-- Empty State -->
                                <tr th:if="${users.empty}">
                                    <td colspan="7" class="text-center text-muted py-4">
                                        No users found.
                                    </td>
                                </tr>

                                </tbody>

                            </table>

                        </div>

                        <!-- Pagination -->
                        <nav th:if="${users.totalPages > 1}">

                            <ul class="pagination justify-content-center">

                                <!-- Previous -->
                                <li class="page-item"
                                    th:classappend="${users.first} ? 'disabled'">

                                    <a class="page-link"
                                       th:href="@{/admin/users(page=${users.number - 1}, search=${search})}">
                                        Previous
                                    </a>
                                </li>

                                <!-- Page Numbers -->
                                <li class="page-item"
                                    th:each="pageNumber : ${#numbers.sequence(0, users.totalPages - 1)}"
                                    th:classappend="${pageNumber == users.number} ? 'active'">

                                    <a class="page-link"
                                       th:href="@{/admin/users(page=${pageNumber}, search=${search})}"
                                       th:text="${pageNumber + 1}">
                                    </a>

                                </li>

                                <!-- Next -->
                                <li class="page-item"
                                    th:classappend="${users.last} ? 'disabled'">

                                    <a class="page-link"
                                       th:href="@{/admin/users(page=${users.number + 1}, search=${search})}">
                                        Next
                                    </a>
                                </li>

                            </ul>

                        </nav>

                    </div>

                </div>
                <!-- /.container-fluid -->



            </div>
            <!-- End of Main Content -->

            <!-- Copyright -->
            <div th:replace="~{Dashboard/fragments/copyright :: copyright}"></div>

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top -->
    <div th:replace="~{Dashboard/fragments/scrolltotop :: scrolltotop}"></div>

    <!-- Logout Modal -->
    <div th:replace="~{Dashboard/fragments/logout-modal :: logout-modal}"></div>

    <!-- Footer -->
    <div th:replace="~{Dashboard/fragments/footer :: footer}"></div>

</body>
</html>
