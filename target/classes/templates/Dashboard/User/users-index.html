
<!DOCTYPE html>
<html lang="en">

<head th:replace="~{Dashboard/fragments/header :: header('Users')}"></head>

<body id="page-top">

<!-- Page Wrapper -->
<div id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{Dashboard/fragments/sidebar :: sidebar}"></div>

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column">

        <!-- Main Content -->
        <div id="content">

            <!-- Topbar -->
            <div th:replace="~{Dashboard/fragments/topbar :: topbar}"></div>

            <!-- Begin Page Content -->
            <div class="container-fluid">

                <!-- Breadcrumb -->
                <div th:replace="~{Dashboard/fragments/breadcrumb :: breadcrumb}"></div>

                <!-- Page Heading -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>
                        <h1 class="h3 mb-1 font-weight-bold text-dark">
                            Users
                        </h1>

                        <p class="text-muted mb-0">
                            Create and manage application users.
                        </p>
                    </div>

                    <a th:href="@{/admin/users/add}"
                       class="btn btn-primary">
                        <i class="fas fa-user-plus mr-2"></i>
                        Add New User
                    </a>

                </div>

                <!-- Users Card -->
                <div class="card shadow-sm mb-4">

                    <!-- Role Tabs -->
                    <div class="card-header bg-white py-3">

                        <ul class="nav nav-tabs card-header-tabs">

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:classappend="${selectedRoleGroup == null or selectedRoleGroup.isEmpty()} ? 'active'"
                                   th:href="@{/admin/users(search=${search})}">
                                    All Users
                                    <span class="badge badge-secondary"
                                          th:text="${#lists.size(allUsers)}">0</span>
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:classappend="${selectedRoleGroup == 'administrators'} ? 'active'"
                                   th:href="@{/admin/users(roleGroup='administrators', search=${search})}">
                                    Administrators
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:classappend="${selectedRoleGroup == 'employees'} ? 'active'"
                                   th:href="@{/admin/users(roleGroup='employees', search=${search})}">
                                    Employees
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:classappend="${selectedRoleGroup == 'other'} ? 'active'"
                                   th:href="@{/admin/users(roleGroup='other', search=${search})}">
                                    Other Roles
                                </a>
                            </li>

                        </ul>

                    </div>

                    <!-- Card Body -->
                    <div class="card-body">

                        <!-- Filters and Bulk Actions -->
                        <div class="row align-items-center mb-4">

                            <!-- Bulk Actions -->
                            <div class="col-lg-4 mb-3 mb-lg-0">

                                <div class="input-group">

                                    <select class="custom-select"
                                            id="bulkAction">
                                        <option value="">Bulk Actions</option>
                                        <option value="delete">Delete</option>
                                    </select>

                                    <div class="input-group-append">
                                        <button type="button"
                                                class="btn btn-secondary"
                                                id="applyBulkAction">
                                            Apply
                                        </button>
                                    </div>

                                </div>

                            </div>

                            <!-- Role Filter -->
                            <div class="col-lg-2 mb-3 mb-lg-0">

                                <form th:action="@{/admin/users}" method="get">

                                    <input type="hidden"
                                           name="search"
                                           th:value="${search}">

                                    <input type="hidden"
                                           name="roleGroup"
                                           th:value="${selectedRoleGroup}">

                                    <select class="custom-select"
                                            name="role"
                                            onchange="this.form.submit()">

                                        <option value="">All Roles</option>

                                        <option th:each="roleOption : ${roles}"
                                                th:value="${roleOption.role}"
                                                th:text="${roleOption.role}"
                                                th:selected="${selectedRole == roleOption.role}">
                                        </option>

                                    </select>

                                </form>

                            </div>

                            <!-- Provider Filter -->
                            <div class="col-lg-3 mb-3 mb-lg-0">

                                <form th:action="@{/admin/users}"
                                      method="get"
                                      class="d-flex align-items-center gap-2">

                                    <input type="hidden"
                                           name="search"
                                           th:value="${search}">

                                    <input type="hidden"
                                           name="role"
                                           th:value="${selectedRole}">

                                    <input type="hidden"
                                           name="roleGroup"
                                           th:value="${selectedRoleGroup}">

                                    <select class="custom-select flex-grow-1"
                                            id="providerFilter"
                                            name="provider"
                                            onchange="this.form.submit()">

                                        <option value="">All Providers</option>

                                        <option value="LOCAL"
                                                th:selected="${selectedProvider == 'LOCAL'}">
                                            Local
                                        </option>

                                        <option value="GOOGLE"
                                                th:selected="${selectedProvider == 'GOOGLE'}">
                                            Google
                                        </option>

                                        <option value="GITHUB"
                                                th:selected="${selectedProvider == 'GITHUB'}">
                                            GitHub
                                        </option>

                                    </select>

                                    <a th:href="@{/admin/users}"
                                       class="btn btn-secondary text-nowrap flex-shrink-0">
                                        <i class="bi bi-arrow-counterclockwise me-1"></i>
                                        Reset
                                    </a>

                                </form>

                            </div>

                        </div>

                        <!-- Users Table -->
                        <div class="table-responsive">

                            <table id="usersTable"
                                   class="table table-bordered table-hover align-middle">

                                <thead class="table-light">

                                <tr>
                                    <th style="width: 35px;">
                                        <input type="checkbox"
                                               id="selectAllUsers">
                                    </th>

                                    <th>User</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Provider</th>
                                    <th>Registered</th>
                                    <th class="text-center">Actions</th>
                                </tr>

                                </thead>

                                <tbody>

                                <!-- User Rows -->
                                <tr th:each="user : ${allUsers}">

                                    <!-- Checkbox -->
                                    <td>
                                        <input type="checkbox"
                                               class="user-checkbox"
                                               th:value="${user.userId}">
                                    </td>

                                    <!-- Username and Avatar -->
                                    <td>

                                        <div class="d-flex align-items-center">

                                            <img th:src="${user.profilePicture != null
        and !user.profilePicture.isEmpty()
        ? '/uploads/profile/' + user.profilePicture
        : (user.oauthPicture != null
            ? user.oauthPicture
            : '/img/default-avatar.png')}"
                                                 alt="Profile"
                                                 class="rounded-circle mr-2"
                                                 width="50"
                                                 height="50"
                                                 style="object-fit: cover;"
                                                 onerror="this.onerror=null; this.src='/img/default-avatar.png';">

                                            <strong th:text="${user.username}">
                                                Username
                                            </strong>

                                        </div>

                                    </td>

                                    <!-- Full Name -->
                                    <td>
                                        <span th:text="${(user.firstName != null ? user.firstName : '')
                                            + ' ' +
                                            (user.lastName != null ? user.lastName : '')}">
                                            Full Name
                                        </span>
                                    </td>

                                    <!-- Email -->
                                    <td>
                                        <span th:text="${user.email}">
                                            email@example.com
                                        </span>
                                    </td>

                                    <!-- Role -->
                                    <td>
                                        <span class="badge badge-info"
                                              th:text="${user.userRole}">
                                            USER
                                        </span>
                                    </td>

                                    <!-- Provider -->
                                    <td>
                                        <span th:text="${user.oauthProvider != null
                                            ? user.oauthProvider : 'Local'}">
                                            Local
                                        </span>
                                    </td>

                                    <!-- Registration Date -->
                                    <td>
                                        <span th:text="${user.createdAt != null
                                            ? #dates.format(user.createdAt, 'dd MMM yyyy')
                                            : '-'}">
                                        </span>
                                    </td>

                                    <!-- Actions -->
                                    <td class="text-center text-nowrap">

                                        <a th:href="@{/admin/users/view/{id}(id=${user.userId})}"
                                           class="text-primary mr-2"
                                           title="View User">
                                            <i class="fas fa-eye"></i>
                                            View
                                        </a>

                                        <a th:href="@{/admin/users/edit/{id}(id=${user.userId})}"
                                           class="text-primary mr-2"
                                           title="Edit User">
                                            <i class="fas fa-edit"></i>
                                            Edit
                                        </a>

                                        <form th:action="@{/admin/users/delete/{id}(id=${user.userId})}"
                                              method="post"
                                              class="d-inline"
                                              onsubmit="return confirm('Are you sure you want to delete this user?');">

                                            <button type="submit"
                                                    class="btn btn-link text-danger p-0"
                                                    title="Delete User">
                                                <i class="fas fa-trash-alt"></i>
                                                Delete
                                            </button>

                                        </form>

                                    </td>

                                </tr>


                                </tbody>

                            </table>

                        </div>



                    </div>
                    <!-- End Card Body -->

                </div>
                <!-- End Users Card -->

            </div>
            <!-- End Container Fluid -->

        </div>
        <!-- End Main Content -->

        <!-- Copyright -->
        <div th:replace="~{Dashboard/fragments/copyright :: copyright}"></div>

    </div>
    <!-- End Content Wrapper -->

</div>
<!-- End Page Wrapper -->

<!-- Scroll to Top -->
<div th:replace="~{Dashboard/fragments/scrolltotop :: scrolltotop}"></div>

<!-- Logout Modal -->
<div th:replace="~{Dashboard/fragments/logout-modal :: logout-modal}"></div>

<!-- Footer -->
<div th:replace="~{Dashboard/fragments/footer :: footer}"></div>

<!-- User Table Scripts -->
<script>


    document.addEventListener('DOMContentLoaded', function () {

        const table = new DataTable('#usersTable', {

            pageLength: 10,

            lengthMenu: [10, 25, 50, 100],

            ordering: true,
            searching: true,
            paging: true,
            info: true,

            order: [ [1, 'asc'] ],

            responsive: true,

            columnDefs: [
                {
                    orderable: false,
                    searchable: false,
                    targets: [0, 7]
                }
            ],

            language: {
                emptyTable: "No users found.",
                zeroRecords: "No matching users found."
            }

        });

        // Select all users on the current DataTables page
        const selectAllUsers = document.getElementById('selectAllUsers');

        if (selectAllUsers) {

            selectAllUsers.addEventListener('change', function () {

                table.rows({ page: 'current' }).nodes().to$()
                    .find('.user-checkbox')
                    .prop('checked', this.checked);

            });

        }

        // Individual checkbox selection
        document.querySelector('#usersTable tbody')
            .addEventListener('change', function (event) {

                if (event.target.classList.contains('user-checkbox')) {

                    const checkboxes = table.rows({ page: 'current' })
                        .nodes().to$().find('.user-checkbox');

                    const checked = checkboxes.filter(':checked');

                    if (selectAllUsers) {
                        selectAllUsers.checked =
                            checkboxes.length > 0 &&
                            checkboxes.length === checked.length;
                    }

                }

            });

        // Reset Select All when changing pages
        table.on('draw', function () {
            if (selectAllUsers) {
                selectAllUsers.checked = false;
            }
        });

    });


</script>

</body>
</html>
